<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Snapshot — Caseload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#cc785c; --coral-active:#a9583e; --coral-soft:#e8a186;
  --ink:#141413; --body:#3d3d3a; --muted:#6c6a64; --muted-soft:#8e8b82;
  --hairline:#e6dfd8; --hairline-soft:#ebe6df;
  --canvas:#faf9f5; --card:#efe9de; --cream-strong:#e8e0d2;
  --dark:#181715; --dark-el:#252320;
  --on-dark:#faf9f5; --on-dark-soft:#a09d96;
  --amber:#e8a55a; --amber-deep:#a86a1f; --success:#5db872; --success-deep:#3c7d4c;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;height:100%;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

/* ---------- masthead ---------- */
.mast{background:var(--dark);color:var(--on-dark);flex:none}
.mast .in{max-width:1360px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.2px;white-space:nowrap}
.navwords{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1}
.navwords button{font-size:11.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--on-dark-soft);padding:5px 11px;border-radius:8px;white-space:nowrap;transition:background .13s,color .13s}
.navwords button:hover{color:var(--on-dark);background:var(--dark-el)}
.navwords button.on{color:var(--on-dark);background:var(--dark-el)}
.navwords button.on::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--coral);margin-right:7px;vertical-align:2px}
.navwords button .n{font-size:10px;color:var(--on-dark-soft);margin-left:5px}
.mechip{font-size:12px;font-weight:500;color:var(--coral-soft);background:rgba(204,120,92,.16);border-radius:9999px;padding:4px 13px;white-space:nowrap}
.substrip{background:var(--canvas);border-bottom:1px solid var(--hairline);flex:none}
.substrip .in{max-width:1360px;margin:0 auto;padding:7px 28px;font-family:var(--mono);font-size:11.5px;color:var(--muted-soft);display:flex;gap:8px;flex-wrap:wrap}
.substrip .hi{color:var(--amber-deep);font-weight:500}

/* ---------- shell ---------- */
.page{max-width:1360px;margin:0 auto;padding:0 28px;width:100%;flex:1;min-height:0}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:22px;padding:20px 0;height:100%}
@media (max-width:1080px){.shell{grid-template-columns:1fr}.rail{display:none}}
/* only the caseload scrolls -- masthead, strip and rail stay put */
.main{min-height:0;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--hairline) transparent}

/* ---------- rail ---------- */
.rail{height:100%;min-height:0;display:flex;flex-direction:column;background:var(--dark);border-radius:12px;padding:16px 13px 8px;color:var(--on-dark)}
.railcap{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--on-dark-soft);padding:0 8px 11px}
.rsearch{font-family:var(--sans);font-size:13.5px;color:var(--on-dark);width:100%;background:var(--dark-el);border:1px solid transparent;border-radius:8px;padding:8px 11px;margin-bottom:11px;flex:none}
.rsearch::placeholder{color:var(--on-dark-soft)}
.rsearch:focus{outline:0;border-color:var(--coral)}
.rscroll{overflow-y:auto;flex:1;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--dark-el) transparent}
.rgrp{margin-bottom:2px}
.rgrp>.rh{position:sticky;top:0;z-index:1;background:var(--dark);display:flex;align-items:center;gap:7px;width:100%;font-size:11px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--on-dark-soft);padding:8px 8px;border-radius:6px}
.rgrp>.rh:hover{color:var(--on-dark)}
.rgrp>.rh .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgrp>.rh .cv{flex:none;font-size:7px;transform:rotate(90deg)}
.rgrp.shut>.rh .cv{transform:rotate(0)}
.rgrp.pin>.rh{color:var(--coral-soft)}
.rgrp .rbody{padding:2px 0 8px}
.rgrp.shut .rbody{display:none}
.rlink{display:flex;align-items:baseline;gap:6px;width:100%;font-size:15.5px;line-height:1.45;color:var(--on-dark);padding:6px 9px;border-radius:6px}
.rlink .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlink:hover{color:var(--on-dark);background:var(--dark-el)}
.rlink.on{color:var(--on-dark);background:var(--dark-el)}
.rlink.on .t{font-weight:500}
.rlink .dot{color:var(--coral);font-size:9px;flex:none}
.rlink .nu{color:var(--on-dark);background:var(--coral-active);font-family:var(--mono);font-size:9.5px;flex:none;border-radius:9999px;padding:0 6px}
.rempty{color:var(--on-dark-soft);font-size:12px;padding:6px 8px}

/* ---------- caseload ---------- */
.chead{position:sticky;top:0;z-index:3;background:var(--canvas);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:6px 2px 14px}
.chead h1{font-family:var(--serif);font-weight:500;font-size:38px;letter-spacing:-.5px;line-height:1.1}
.chead .tag{color:var(--muted);font-size:13.5px;margin-top:4px}
.chead .tag .hi{color:var(--coral-active);font-weight:500}
.legend{display:flex;gap:22px;font-size:12px;font-weight:500;color:var(--muted);padding-bottom:8px}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:7px}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:4px}
@media (max-width:1240px){.cases{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.cases{grid-template-columns:1fr}}
/* fixed height across the whole grid -- a long plan name used to stretch its row and
   leave every other card in it padded with dead space. the name now clamps at three
   lines and the body takes whatever is left, so the cards stay a set of equals */
.card{position:relative;overflow:hidden;border-radius:12px;padding:28px;height:492px;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
/* 3px tier edge -- carries the tier so the fill isn't doing it alone */
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.dk::before{background:var(--coral)}
.cm::before{background:var(--amber)}
.wh::before{background:var(--hairline);transition:background .15s ease}
button.card{cursor:pointer}
button.card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(20,20,19,.09)}
button.wh:hover{border-color:var(--coral-soft)}
button.wh:hover::before{background:var(--coral-soft)}
/* the big numeral is 48px tall and the white card's status dot is 8 -- pinning the row
   keeps the name block starting at the same height on all three tiers */
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-height:48px;flex:none}
.cphase{font-size:11.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.capline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.rtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted-soft);border:1px solid var(--hairline);border-radius:4px;padding:1px 6px;white-space:nowrap}
.dk .rtag,.dhero .rtag{color:var(--on-dark-soft);border-color:#3a3733}
.cm .rtag{border-color:#ded5c5}
/* every card reserves the same three lines for the name and hangs it from the top of
   that block, so the name always starts right under the eyebrow row. a one-word plan
   and a three-line one still land their case number, body and footer at the same height */
.namebox{height:3.36em;font-size:29px;margin-top:14px;flex:none;display:flex;align-items:flex-start}
.name{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.12;letter-spacing:-.3px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.case{font-family:var(--mono);font-size:12px;letter-spacing:.3px;line-height:1.4;color:var(--muted-soft);margin-top:8px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the count is the number, not a pill wrapped around a word */
.num,.mark{font-family:var(--mono);font-size:34px;line-height:.9;font-weight:500;letter-spacing:-1px}
.num s,.mark s{display:block;text-decoration:none;font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;margin-top:6px;text-align:right}
.num{color:var(--coral-soft)}
.num s{color:var(--on-dark-soft)}
.mark{color:var(--amber-deep)}
.mark s{color:var(--muted)}
/* two lines reserved either way, so a client name that wraps doesn't lift the rule */
.foot{margin-top:22px;padding-top:12px;min-height:45px;border-top:1px solid var(--hairline);font-family:var(--mono);font-size:11.5px;line-height:1.4;color:var(--muted);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex:none}
.foot span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot span:last-child{text-align:right}
.cm .foot{border-top-color:#ded5c5}
.newbadge{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--on-dark);background:var(--coral-active);border-radius:9999px;padding:2px 9px;white-space:nowrap}
.dk{background:var(--dark);color:var(--on-dark)}
.dk .cphase{color:var(--on-dark-soft)}
.dk .case{color:#7d7a73}
.dk .foot{color:var(--on-dark-soft);border-top-color:var(--dark-el)}
.flag{font-size:12px;font-weight:500;color:var(--coral-soft);background:rgba(204,120,92,.16);border-radius:9999px;padding:4px 12px;white-space:nowrap}
.tasks{margin-top:20px;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.task{font-size:13.5px;line-height:1.45;padding-left:16px;position:relative;flex:none;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--coral)}
.dk .task{color:var(--on-dark)}
.task.theirs{color:var(--muted)}
.task.theirs::before{background:var(--muted-soft)}
.dk .task.theirs{color:var(--on-dark-soft)}
.more{font-size:12.5px;color:var(--muted-soft);padding-left:16px;margin-top:1px;flex:none}
.dk .more{color:var(--on-dark-soft)}
.cm{background:var(--card)}
.wait-flag{font-size:12px;font-weight:500;color:var(--amber-deep);background:rgba(232,165,90,.22);border-radius:9999px;padding:4px 12px;white-space:nowrap}
.next{margin-top:20px;flex:1;min-height:0;overflow:hidden}
.next .lbl{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber-deep)}
.next .what{font-size:14.5px;font-weight:500;color:var(--ink);margin-top:6px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.next .also{font-size:12.5px;color:var(--muted);margin-top:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wh{background:var(--canvas);border:1px solid var(--hairline);padding:27px}
.status{margin-top:20px;flex:1;min-height:0;font-size:13.5px;line-height:1.5;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.status b{font-weight:500;color:var(--success-deep)}
.ok-dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none}
.idle-dot{width:8px;height:8px;border-radius:50%;background:var(--cream-strong);border:1px solid var(--hairline);flex:none}
footer{margin-top:28px;font-family:var(--mono);font-size:12.5px;color:var(--muted-soft);border-top:1px solid var(--hairline);padding-top:14px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- detail ---------- */
.back{font-family:var(--mono);font-size:12px;color:var(--muted);padding:2px 0;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--coral-active)}
.frame{border:1px solid var(--hairline);border-radius:16px;overflow:clip}
/* the hero is three sibling dark blocks, not one, so the name line can be
   sticky against the whole frame instead of just its own hero box */
.dhero{background:var(--dark);color:var(--on-dark);padding:30px 34px 0}
/* padding, not the headline's margin -- a top margin here collapses straight
   out of the block and opens a gap under the sticky name plate */
.dbot{background:var(--dark);color:var(--on-dark);padding:12px 34px 26px}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:14px}
.dphase{font-size:11.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--on-dark-soft)}
.hrow{position:sticky;top:0;z-index:5;background:var(--dark);color:var(--on-dark);display:flex;align-items:baseline;gap:20px;padding:10px 34px 0;flex-wrap:wrap}
.dname{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.06;letter-spacing:-.5px}
.dcase{font-family:var(--mono);font-size:23px;color:var(--on-dark-soft)}
/* pinned: shrink to a name plate so the tracker's own sticky heads still fit */
.stuck .hrow{gap:14px;padding:12px 34px 11px;border-bottom:1px solid var(--dark-el)}
.stuck .dname{font-size:20px}
.stuck .dcase{font-size:13px}
.dhead{font-size:14.5px;line-height:1.55;color:var(--on-dark-soft);max-width:780px}
.facts{display:flex;gap:36px;margin-top:18px;padding-top:16px;border-top:1px solid var(--dark-el);flex-wrap:wrap}
.fact span{display:block;font-size:10.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--on-dark-soft)}
.fact b{font-size:13.5px;font-weight:500;color:var(--on-dark);margin-top:3px;display:block}
/* both bodies sit on the warm ground so every section reads as a panel laid
   on it rather than a hairline drawn on the same colour */
.bodyc{padding:22px;background:var(--card)}
.notice{background:var(--canvas);border-radius:10px;padding:12px 18px 12px 21px;font-size:13px;color:var(--amber-deep);font-weight:500;margin-bottom:16px;box-shadow:inset 3px 0 0 var(--amber)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols+.cols{margin-top:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.dcard{position:relative;background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;padding:24px}
.dcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:12px 0 0 12px;background:var(--hairline)}
.dcard.on::before{background:var(--coral)}
/* section header: title, rule, count -- same grammar as the workstream heads */
.sech{display:flex;align-items:baseline;gap:14px;padding-bottom:11px;border-bottom:1px solid var(--hairline)}
.dcard.on .sech{border-bottom-color:var(--coral-soft)}
.sec-h{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.2px}
.sech .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-soft);white-space:nowrap}
.sech .ct.out{color:var(--amber-deep)}
.sech .ct.hot{color:var(--coral-active)}
.sec-sub{font-size:12px;color:var(--muted-soft);margin-top:12px}
.dtasks{margin-top:13px;display:flex;flex-direction:column;gap:12px}
.dtask{padding-left:17px;position:relative}
.dtask::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--coral)}
.dtask.theirs::before{background:var(--muted-soft)}
.dtask.note::before{background:var(--amber-deep)}
.dtask .t{font-size:14px;font-weight:500;line-height:1.4}
.dtask .n{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.dtask .w{font-family:var(--mono);font-size:11px;color:var(--muted-soft);margin-top:3px}
.loads{margin-top:13px}
.load-g{font-size:10.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-soft);margin:12px 0 5px}
.load-g:first-child{margin-top:0}
.load{display:flex;justify-content:space-between;gap:16px;padding:5.5px 0;border-bottom:1px solid var(--hairline-soft);font-size:13px}
.load:last-child{border-bottom:none}
.load .lw{min-width:0}
.load .ln{display:block;font-size:11.5px;color:var(--muted-soft);line-height:1.4}
.load .d{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap}
.load .d.na{color:var(--muted-soft)}
.load .d.out{color:var(--amber-deep);font-weight:500}
.noload{margin-top:13px;font-size:13px;color:var(--muted)}
.hist{margin-top:11px}
.hrow2{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--hairline-soft)}
.hrow2:last-child{border-bottom:none;padding-bottom:0}
.hd{font-family:var(--mono);font-size:12px;color:var(--muted-soft);padding-top:2px}
.hrow2.note .hd{color:var(--amber-deep)}
.ht{font-size:14px;font-weight:500;line-height:1.4}
.hn{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.dec{margin-top:13px;display:flex;flex-direction:column;gap:12px}
.dec-i .t{font-size:14px;font-weight:500;line-height:1.4}
.dec-i .n{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.empty{margin-top:13px;font-size:13px;color:var(--muted-soft)}
.wsec{margin-top:18px;padding-top:4px;border-top:1px solid var(--hairline)}
.threadline{margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted-soft);display:flex;gap:8px;flex-wrap:wrap;padding:0 4px}

/* ---------- NBI task tracker ---------- */
.herolink{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--on-dark);background:var(--dark-el);border:1px solid #35322d;border-radius:9999px;padding:6px 14px;white-space:nowrap}
.herolink:hover{border-color:var(--coral);color:var(--coral-soft)}
.herolink .nb{font-family:var(--mono);font-size:10px;color:var(--on-dark);background:var(--coral-active);border-radius:9999px;padding:1px 7px}
.tkbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--canvas);border-radius:10px;padding:12px 18px 12px 21px;margin-bottom:20px;box-shadow:inset 3px 0 0 var(--amber)}
.tkbar .msg{font-size:13px;font-weight:500;color:var(--amber-deep)}
.tkbar button{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--hairline);border-radius:9999px;padding:5px 13px;background:var(--canvas)}
.tkbar button:hover{color:var(--coral-active);border-color:var(--coral-soft)}
/* workstream head is the only thing that sits on the bare ground -- it divides
   the panels below it, so its rule is darker than a panel hairline */
.ws{margin-top:34px}
.ws:first-of-type{margin-top:0}
.wsh{position:sticky;top:46px;z-index:3;background:var(--card);display:flex;align-items:baseline;gap:15px;padding:12px 0 11px;border-bottom:1px solid #d5cab8}
.wsh .no{font-family:var(--mono);font-size:12px;color:var(--coral-active)}
.wsh h2{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.15;letter-spacing:-.3px}
.wsh .ct{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted-soft)}
/* clip, not hidden -- overflow:hidden would make this a scroll container and
   kill the sticky headers inside it */
.sub{position:relative;overflow:clip;margin-top:16px;background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;padding:0 20px 8px}
.sub::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hairline)}
.sub.fresh::before{background:var(--coral)}
.subh{position:sticky;top:101px;z-index:2;background:var(--canvas);display:flex;align-items:baseline;gap:12px;padding:20px 0 10px;margin-bottom:4px;border-bottom:1px solid var(--hairline)}
.sub.fresh .subh{border-bottom-color:var(--coral-soft)}
.subh .nm{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.subh .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-soft)}
.sub.fresh .subh .ct{color:var(--coral-active)}
.tcopy{font-family:var(--mono);font-size:10px;letter-spacing:.4px;color:var(--muted-soft);border:1px solid var(--hairline);border-radius:9999px;padding:3px 10px;background:var(--canvas);opacity:0;transition:opacity .12s ease}
.sub:hover .tcopy,.tcopy:focus{opacity:1}
.tcopy:hover{color:var(--coral-active);border-color:var(--coral-soft)}
.trow{display:grid;grid-template-columns:minmax(180px,.9fr) 116px minmax(320px,2.4fr);gap:20px;padding:11px 0;border-bottom:1px solid var(--hairline-soft);align-items:start}
.trow:last-child{border-bottom:none}
.thead{padding-bottom:7px;border-bottom:1px solid var(--hairline)}
.thead span{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted-soft)}
.trow .tn{font-size:13px;line-height:1.4}
.trow.todo .tn{color:var(--muted)}
.trow .td{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;min-height:18px}
.trow .tt{font-size:12.5px;line-height:1.55;color:var(--body);overflow-wrap:anywhere}
.tlist{margin:0;padding-left:15px}
.tlist li{margin:0 0 4px}
.tlist li:last-child{margin-bottom:0}
.tdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--success)}
.tna{font-size:9.5px;font-weight:600;letter-spacing:.5px;color:var(--muted);background:var(--card);border-radius:5px;padding:2px 7px}
.tdash{color:#cfc8bf}
.trow.new{background:rgba(204,120,92,.07);box-shadow:inset 3px 0 0 var(--coral);border-radius:0 6px 6px 0;padding-left:14px;margin-left:-17px}
.newtag{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.8px;color:var(--on-dark);background:var(--coral);border-radius:4px;padding:1px 6px;margin-right:7px;vertical-align:1px}
.newtag.updated{color:var(--dark);background:var(--amber)}
.load .newtag{margin:0 0 0 8px}
.tksrc{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted-soft);margin-top:3px}
/* the raw cell is evidence, not the note -- kept for audit, folded away by default */
.raw{margin-top:6px}
.raw summary{font-family:var(--mono);font-size:10.5px;color:var(--muted-soft);cursor:pointer;list-style:none}
.raw summary::-webkit-details-marker{display:none}
.raw summary::before{content:"+ ";color:var(--muted-soft)}
.raw[open] summary::before{content:"\2212 "}
.raw summary:hover{color:var(--coral-active)}
.raw>div{margin-top:5px;padding-left:11px;border-left:2px solid var(--hairline);font-size:11.5px;line-height:1.55;color:var(--muted);white-space:pre-wrap}

/* ---------- source chips ---------- */
.src{position:relative;display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--coral);margin-top:5px;cursor:pointer;white-space:nowrap}
.src:hover{color:var(--coral-active)}
.src svg{width:11px;height:11px;flex:none}
.src+.src{margin-left:14px}
.src.manual{color:var(--amber-deep)}
.src.manual:hover{color:#8a5717}
.pop{position:absolute;bottom:calc(100% + 8px);left:0;width:330px;background:var(--dark);color:var(--on-dark);border-radius:10px;padding:14px 16px;box-shadow:0 6px 24px rgba(20,20,19,.22);opacity:0;visibility:hidden;transition:opacity .12s;z-index:5;font-family:var(--sans);white-space:normal;cursor:default}
.src:hover .pop,.src:focus-visible .pop{opacity:1;visibility:visible}
.pop .pw{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);border-bottom:1px solid var(--dark-el);padding-bottom:7px;margin-bottom:7px}
.pop .pf{font-size:12.5px;font-weight:500;color:var(--on-dark)}
.pop .pd{display:block;font-family:var(--mono);font-size:10.5px;color:var(--on-dark-soft);margin-top:2px}
.pop .ps{display:block;font-size:11.5px;color:var(--on-dark-soft);margin-top:7px;line-height:1.45;border-top:1px solid var(--dark-el);padding-top:7px}
.pop .po{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--coral-soft);margin-top:9px}
.loads .src{margin:0}
.load .src .pop, .sec-sub .src .pop{bottom:auto;top:calc(100% + 8px);left:auto;right:0}
.cols>.dcard:last-child .src .pop{left:auto;right:0}

/* ---------- mail modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,20,19,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:32px}
.overlay.on{display:flex}
.modal{background:var(--canvas);border-radius:16px;max-width:660px;width:100%;max-height:82vh;overflow:auto}
.m-head{background:var(--dark);color:var(--on-dark);padding:22px 28px;border-radius:16px 16px 0 0}
.m-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--coral-soft)}
.m-tag.manual{color:var(--amber)}
.m-subj{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.25;margin-top:8px;letter-spacing:-.2px}
.m-meta{display:flex;gap:26px;margin-top:12px;font-size:12.5px;color:var(--on-dark-soft);flex-wrap:wrap}
.m-meta b{color:var(--on-dark);font-weight:500}
.m-body{padding:24px 28px 28px;font-size:14px;line-height:1.65;color:var(--body);white-space:pre-line}
.m-close{float:right;background:var(--dark-el);color:var(--on-dark);border-radius:9999px;width:30px;height:30px;font-size:15px;line-height:1;text-align:center}

9932 MISBO - Base Files for New Clients 00048","body":"Good afternoon all,\n\nThanks Sarah. I would hold off on anything for now. @Venturatos, Donna Since we will need the client to provide data anyway, even though it is now quite late, should I prepare a non-outsourced census template for them to fill out and return?\n\nAccording to our records we have requested additional data or clarification after receiving the original data that we have not received a response to at this time. If we do not receive a response to this additional request by February 23, 2026, we cannot guarantee that we will meet the IRS-mandated time frame of March 13th, 2026 as additional time will be needed to gather the missing data. If the IRS-mandated time frame is missed, and the testing results ultimately reflect “failing” and refunds are needed, an IRS excise tax will be imposed on the employer.","manual":false},{"from":"Venturatos, Donna","d":"2026-02-19","time":"19:09","subj":"RE: TA069932 MISBO - Base Files for New Clients 00048","body":"Hi,\n\nThis is the Association of Waldorf Schools of North America (AWSNA). They are very small (I believe 8 active, 16 terminated at conversion) and it is apparent that we do not have the data needed, so please ask them to provide it.\n\nSarah, is this something we normally request for a merging plan and didn’t? I may get asked that question. If it is something we need and it’s not already part of the onboarding agenda template and process, can we look at having this added?\n\nChris, this is an Association (not a school) that is actively bringing Waldorf schools into the MEP, so MISBO and OneDigital will be more sensitive to AWSNA’s experience. Because they are an association (like MISBO, PAISBOA, and CALISBOA), Stephanie Rynas is on the bi-weekly calls with us, MISBO and OneDigital, so I’ll need to follow what’s happening in the event she brings it up on one of the calls. If needed, I think we can also ask Cash at OneDigital for assistance/hand holding.","manual":false}]},{"d":"Jul 22","t":"Request compensation data from the client","n":"Reassigned — Account Management owns the ask. The data still is not in our possession, so compliance testing stays blocked until it arrives.","src":[{"from":"Klein, Chris","d":"2026-02-18","time":"09:40","subj":"RE: TA069932 MISBO - Base Files for New Clients 00048","body":"Good morning all,\n\nIt should be loaded so that all compensation amounts can be calculated based on entry dates. Having dealt with so many new clients on other contracts this year, clients struggle with getting us all of the testing data – especially it being so late. Loading the compensation will allow for me to provide them a census file so they can review and update only what may be necessary to update.","manual":false},{"from":"Juhl, Sarah","d":"2026-02-18","time":"14:19","subj":"RE: TA069932 MISBO - Base Files for New Clients 00048","body":"Hi Chris,\n\nIn order to load compensation we’ll need to receive it from the client, since we do not otherwise have any record of it. I think no matter what, we’ll run into an issue of having to work with the client to get us the info in a format that works. From your comment regarding calculating based on entry dates – do you need comp broken down by pay period all year or just a YTD total up to the point that we took over the plan?\n\nSarah Juhl\n\nLead Client Onboarding Manager, Transition Services\n\nsarah.juhlhalsrud@transamerica.com","manual":false},{"from":"Venturatos, Donna","d":"2026-02-19","time":"19:09","subj":"RE: TA069932 MISBO - Base Files for New Clients 00048","body":"Hi,\n\nThis is the Association of Waldorf Schools of North America (AWSNA). They are very small (I believe 8 active, 16 terminated at conversion) and it is apparent that we do not have the data needed, so please ask them to provide it.\n\nSarah, is this something we normally request for a merging plan and didn’t? I may get asked that question. If it is something we need and it’s not alr  provision and the LTPT rules is based on hours of service, the preferred method is actual hours. If the employer does not currently track actual hours, they would need to determine an acceptable hours equivalency method if permitted for their payroll administration and ensure it is applied consistently. There is not a default semi-monthly equivalency value that Transamerica assigns.\n\nSince the client has confirmed they do not currently have any part-time employees, it may also be worth confirming whether they would prefer to remove the part-time exclusion altogether if excluding the class does not have any practical impact on their workforce. Removing the exclusion would simplify future administration and avoid the need to administer both the Year of Service exception and the LTPT rules should part-time employees be hired in the future.\n\nThanks\n\nLindsay Loglisci\n\nPlan Specialist, Document Operations\n\nlindsay.loglisci@transamerica.com \n\nTransamerica\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]},{"d":"Jul 13","t":"Basis loaded","n":"Hardship Basis and Roth first-contribution dates were still outstanding when Sarrah flagged them; Joel loaded them the same morning, clearing the last data item before go-live.","src":[{"from":"Abacherli, Joel","d":"2026-07-13","time":"12:35","subj":"Bonnier Corporation - QK63283/00105 - DC status update","body":"Basis loaded.\n\nRecordKeeper:\n\nTask Fidelity Investments Comments\n\nAccount Balances 07/06/2026 Fidelity Investments:202607069227BJ - 17,692,243.89\n\n20260707922MJR - 8,379.52\n\nShares Reregistering N/A\n\nLoans 07/09/2026\n\nFortfeitures 07/06/2026 Fidelity Investments:999-99-9999 - 50,762.87\n\nPCRA/SDA N/A\n\nHardship Basis\n\nRoth First Contrib Date\n\nRMD\u0027s/Recurring Payments\n\nInvestment Allocations 06/03/2026 Fidelity Investments:Cash conversion - all employees defaulted.\n\nConversion:\n\nTask Fidelity Investments Comments\n\nCensus 06/03/2026\n\nDeferrals 07/09/2026\ o completed a Year of Service (1,000 hours during the employment year) would become eligible to participate. We mirrored that prior plan provision.\n\nWith respect to the long-term part-time (LTPT) rules, those are separate from the plan’s standard eligibility provisions. Even though part-time employees are excluded as a class, SECURE 2.0 requires certain long-term part-time employees to be permitted to make elective deferrals once they satisfy the applicable LTPT service requirements (assuming they are not otherwise excluded under a permissible exclusion). The LTPT rules operate as an exception to the otherwise applicable part-time exclusion.\n\nRegarding your questions on hours administration, because eligibility under both the Year of Service provision and the LTPT rules is based on hours of service, the preferred method is actual hours. If the employer does not currently track actual hours, they would need to determine an acceptable hours equivalency method if permitted for their payroll administration and ensure it is applied consistently. There is not a default semi-monthly equivalency value that Transamerica assigns.\n\nSince the client has confirmed they do not currently have any part-time employees, it may also be worth confirming whether they would prefer to remove the part-time exclusion altogether if excluding the class does not have any practical impact on their workforce. Removing the exclusion would simplify future administration and avoid the need to administer both the Year of Service exception and the LTPT rules should part-time employees be hired in the future.\n\nThanks\n\nLindsay Loglisci\n\nPlan Specialist, Document Operations\n\nlindsay.loglisci@transamerica.com \n\nTransamerica\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]},{"t":"Eligibility dates adjusted to prevent forfeiture","n":"Jeremy Thompson\u0027s call on the eight participants whose term date precedes their eligibility date.","src":[{"from":"Jeremy Thom NAM BRIDGES US INC 401(K) PLAN 259549 - Deconversion Project","body":"Plan Name: CANAM BRIDGES US INC 401(K) PLAN 259549\n\nHello Theresa and Timothy,\n\nWe have received the required paperwork for your plan’s transfer to your new service provider. The receipt of your Letter of Intent begins the 60-day notification period required for service termination, per the Recordkeeping Service Agreement. We also have a 45-day requirement once the Service Termination Authorization form is received in good order.\n\n****Your plan contains the Putnam Stable Value 15 fund which has a 12-month put/hold on the liquidation of this asset. Putnam requires a 45-day notification letter to possibly waive this hold and liquidate the fund or a portion of this fund. Please see the attached notification letter. This needs to be returned to me as soon as possible. Once received the notification letter would be submitted to Putnam for liquidation approval. This must be submitted no later than 8/14/2025. Should Putnam deny the liquidation request then the fund would need to be re-registered with your new recordkeeper to move forward with the conversion. If this fund cannot be re-registered with the new recordkeeper, then the conversion would be delayed until the put has been met..****\n\n****If the Putnam Stable Value 15 fund can be re-registered, please complete the attached Fund Re-registration Instructions form with the new trust company information and the new receiving fund account number. Return this to me by 9/9/2026.****\n\nWe have requested that our Finance department generate your final invoice(s) for fees (if applicable) and they will be sent to you for payment. Please be aware that your choice of payment method indicated on the Service Termination Authorization form will override your existing method for paying fees.\n\nThe timeline below outlines each step in the deconversion process. Failure to meet any of these deadlines may result in delaying the plan’s asset transfer.\n\nDeadline Date\n\nMilestone\n\nDescription\n\nReturn as soon as possible\n\nFund Agreement\n\nPlease complete the attached stable value fund notification. An executed Liquidation Request Form is received from the plan sponsor requesting that the Stable Value/Capital Preservation fund be liquidated. Ascensus will submit the form to the fund company. This needs to be submitted 45-days prior to liquidation date.\n\n9/9/2026\n\nFund Re-Registration Instructions\n\nWe will need to receive a copy of the completed Fund Re-registration Instructions form, see attachment. This information is needed for the processing of the fund re-registrations to your new provider\n\n9/16/2026\n\nFinal Payroll Contributions…","manual":false}]},{"d":"Jul 10","t":"Putnam liquidation form completed","n":"Signed and returned by Daniel, minus the PFTC account number.","src":[{"from":"Daniel Clements","d":"2026-07-10","time":"12:45","subj":"RE: CANAM BRIDGES US INC 401(K) PLAN 259549 - Deconversion Project","body":"Hi Carey,\n\nThanks for your message. I just worked with Tim to complete the Putnam liquidation form. Please see attached.\n\nNote: I did not have the PFTC account number at the time, so it is not included on the signed version we had previously completed. Please let us know if you need anything else for the liquidation request.","manual":false},{"from":"Carey Brown","d":"2026-07-10","time":"12:52","subj":"RE: CANAM BRIDGES US INC 401(K) PLAN 259549 - Deconversion Project","body":"Daniel,\n\nI will submit the signed form to the fund manager, and I will let you know once they respond.\n\nPlease note: I will be out of the office on Monday July 13th and I will be returning to the office on Wednesday, 7/15/2026. I will not have access to email or voice messages during this time. If you need immediate assistance please call 844-237-2364.","manual":false}]},{"d":"Jul 15","t":"Putnam stable value notice received","n":"Response on the fund\u0027s treatment came back from Carey.","src":[{"from":"Care r the 401(k)-plan merger, so we will need to place a hold on this process.\n\nHowever, if possible, we would like to keep the time to talk about terminating the Lincoln Stable Value fund in the 401(k) and 403(b) plans at Fidelity and look at establishing a date to pay the MVA and move the assets to a money market fund.\n\nIs this the right group to address this?\n\nJamie","manual":false},{"from":"Spalluto-Hued, Amy","d":"2026-04-23","time":"10:58","subj":"RE: [External] RE: EXTERNAL: 7316202 - CENTRAL MAINE HEALTHCARE 401K Deconversion Project: Kickoff Call","body":"Hi Jamie,\n\nThat is a great question. Termination of a stable value in conjunction with these two projects would not really involve Fidelity; this is a matter between Transamerica, Prime Healthcare, and in this case, Lincoln. We are client directed; therefore depending on the outcome of the conversation, we would either prepare the fund for liquidation or to transfer in kind. If you are in fact paying the MVA to release the Put, we would only need verification that the MVA was paid (this can be an email record between Prime, Transamerica and Lincoln confirming their agreement to receive payment and confirmation of payment).\n\nIf we are going to rollover participants by June 1, we need to get moving on the kickoff, however, or we will run out of time.\n\nI would suggest kicking off the project and getting documentation in order, and meeting separately with Transamerica regarding the Stable Value. If we have time after we cover the kickoff details we can certainly talk about the Stable Value, but priority for the call is to get us on track to achieve what you are asking of us. If we do not have a rollover window established, we cannot confirm the timeline.\n\nAmy","manual":false}]},{"task":"Work the reopened Fidelity project scopes","note":"Alison had to enter new projects because the originals lapsed through inactivity, which means Amy may no longer be assigned. The 403(b) group rollover scope confirmat  making elections on Paper enrollment forms even if we end up adding this NQDC to the online enrollment process.\n\nAs part of our procedures, a Reg Support NQDC Subject Matter Expert (Florence, Ben or Bob) is assigned by Janine Thomson to work with the Transition Manager to have the Enrollment Form and Plan Highlights created.\n\nBut beforehand, Reg Support generally would need an executed Plan document. So even though the Plan effective date is 9/1/2026, we would need to get the signed Plan document much earlier so Reg Support can start working on the Enrollment Form and Plan Highlights. Otherwise, the enrollment would be delayed. Reg Support may be able to start working on this but it cannot be released until after we get the executed Plan document back.","manual":false}]},{"task":"Get the plan document executed well ahead of 9/1","note":"Melanie flagged that a brand-new NQDC plan document must be executed before the effective date, and that Reg Support needs the signed document much earlier than 9/1 to build the enrollment form and plan highlights. The signed PRD delivered 7/22 is not the plan document.","who":"Tricia","src":[{"from":"Gerber, Melanie","d":"2026-07-01","time":"08:32","subj":"FW: NQ98510 CIS Secure Computing, Inc. Non-Qualified- PRD inquiries","body":"Hi Muriel – I reviewed the attached PRD (first attachment) with the notes that the client has requested our guidance. I made comments and they are noted in track changes.\n\nSee my responses to this email I have included (second attachment).\n\n@Johnson, Tricia @Sanchez, Muriel \n\nAlso, I want to point out that as this is a brand new NQDC Plan, the Plan document must be executed prior to the 9/1/2026 effective date. Also, we need to know how and when Participants will be making deferral and distribution elections.\n\nDo we know if this NQDC Plan is going to be utilizing the NQDC online enrollment process for elections and tracking?\n\nSince this is a brand NQDC Plan and all the Participants are newl ource Inquiry [ZSecure]","body":"Good Morning Dave,\n\nGuessing it may not be necessary for me to provide an update for Annette, related to the payroll file reversals \u0026 corrections Treva will start working on, since you’re putting together an email related to the open items discussed when the group met yesterday afternoon.\n\nThanks \u0026 talk soon,\n\nDamien Hurm / Sr. Client Onboarding Manager\n\nWorkplace Solutions Transition Services – Large Market Retirement\n\no: (727) 557-2813\n\ne: damien.hurm@transamerica.com / w: www.transamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]},{"d":"Jul 22","t":"Prior remittance to be reversed","n":"Treva confirmed after her morning call with Bernie and Diane that the incorrect postings on the earlier payrolls will be reversed. That closes the half of this that Transamerica controls; only the going-forward file remains.","src":[{"from":"Guyer, Treva","d":"2026-07-22","time":"06:37","subj":"RE: [Secure] COCC, Inc. NQ98507 - Payroll Corrections. [ZSecure]","body":"The prior remittance issue will be reversed per Diane and my call with Bernie this morning.\n\nThe going forward issue will have to be resolved by the client/payroll provider.\n\nMichelle Orsini is the only ppt that is the current source issue. Her money is coming in as 2026 in service EE \u0026 ER but should be 2026 Retirement EE \u0026 ER.\n\nThank you and have a great day!!\n\n***ADVANCE NOTICE***\n\nI will be out of the office on Friday, July 24th and 31st without access to emails or voicemails.\n\n**Please include your Transamerica Plan Name and Number on all correspondences.**\n\nTreva Guyer\n\nTeam Lead, Account Management\n\nB: 319-355-6104\n\nTF: 800-755-5803, ext. 1206104\n\ntreva.guyer@transamerica.com \n\nTransamerica\n\nProtection Solutions and Savings \u0026 Investments\n\n6400 C St. SW, MD 2ECR\n\nCedar Rapids, IA 52499\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]},{"d":"Jun 16","t":"Cost basis loaded tial inconsistencies in the April and May values. Some of the figures did not align with what we expected to see, so before we can fully validate the data, we need a better understanding of how those values were calculated and entered into the system. Specifically, the average unit values appear to be potentially inaccurate; however, because we do not currently know the source or methodology used to derive those numbers, we cannot yet determine whether the data is correct.\n\nAt this point, the initial Cost Basis load has been resolved, but additional review is needed for the April and May values before we can confirm that everything is fully accurate.\n\nIf a meeting would be helpful, I can coordinate with David to join. He has extensive knowledge of this subject matter and was instrumental in helping us complete the work on Friday. His insight would be very valuable as we continue the review.\n\nThank you, everyone. Have a great weekend, and I\u0027ll talk with you all next week.\n\nJoel Abacherli\n\nSr. Data Consultant, Client Onboarding\n\nO: 415-421-1185\n\njoel.abacherli@transamerica.com \n\nTransamerica\n\nWorkplace Solutions, Transition Services\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]},{"d":"Dec 17","t":"Initial client call","n":"Conversion timelines confirmed for all four plans in December.","src":[{"from":"Hurm, Damien","d":"2026-01-16","time":"10:45","subj":"RE: COCC - Ongoing Internal Call 1.16 (recap)","body":"Good Morning Everyone,\n\nA few of us were able to join this internal call earlier, please see below \u0026 let me know if you have any questions.\n\nThe initial call with the client took place 12.17 \u0026 we met again to review the updated agenda 1.14, both recaps are attached.\n\n** there are three non-qualified plans (large market) \u0026 one 401k (mid-market) plan being transitioned from John Hancock, conversion timeline for each confirmed in December.\n\n(dhurm) Chris can begin working on system setup whil ancock\n\n* 2/27/2026 – Blackout Start Date with John Hancock\n\n* 3/6/2026 – Liquidation Date with John Hancock\n\n* 3/9/2026 – Wire Date with John Hancock\n\n* 3/16/2026 – Final Takeover Records with John Hancock\n\n* 4/3/2026 – Go Live Deadline with Transamerica.\n\nPayroll to Transamerica (dhurm) the 2/20 payroll file will likely be the last payroll processed with John Hancock before blackout begins 2/27 \u0026 the 3/6 payroll will be the first payroll funded with Transamerica.\n\nPlan Documents and Agreements\n\n* Transfer of Assets Agreement (dhurm) this may only be necessary for the three non-qualified accounts.\n\n(dhurm) I’ll create the fund mapping generator once the plan is exported in eDocs.\n\n* Plan Review Document (dhurm) Chris \u0026 Melanie reviewed the PRD for each non-qualified account 1/7.\n\n(dhurm) Joel created the first draft of the source mapping for each \u0026 I’ll use these spreadsheets to complete the source mapping chart at the end of the PRD’s before creating the DocuSign item for the client to complete.\n\n* Funding Documents\n\n** PRD (dhurm) non-qualified accounts only, pending completion.\n\n** Secure Act 2.0 Auth Agreement (dhurm) mid-market 401k plan only.\n\n** Inspira Agreement (dhurm) mid-market 401k plan only\n\n** Trust Agreements (dhurm) mid-market 401k plan…","manual":false}]},{"d":"Jan 23","t":"Four plans confirmed and named","n":"Key Bank 401(k) PEP 518203, plus COCC Performance-Based Officer Retirement NQ98506, Deferred Compensation NQ98507 and SERP NQ98508.","src":[{"from":"Hurm, Damien","d":"2026-01-23","time":"10:33","subj":"RE: COCC - Ongoing Internal Call 1.23 (recap)","body":"Good Afternoon Everyone,\n\nA few of us were able to join this internal call earlier, please see below \u0026 let me know if you have any questions.\n\nPlease see recap from the 1/21 call for the following four plans.\n\n* Key Bank 401(k) Pooled Employer Plan – 518203 00000\n\n* Connecticut On-Line Computer Center, Inc. Performance-Based Offic g Health Concepts fund lineup ASAP to mirror new mapping strategy for Nursing Placements. – Dev submitted fund change request.\n\n3. Plan Documents and Agreements\n\na. Transfer of Assets Agreement- This has been signed (Jennifer will need to make edits) Chris is checking on using the current signature to proceed forward\n\nb. Plan Review Document- Need address, EIN, and phone for all participating employers. Also need Micheal to confirm if all contributions will be changed to 100% vested or be kept in a frozen source with current vesting schedules.\n\nc. Funding Documents- TBD\n\n* Board resolution: -Completed\n\n* Successor trustee letter: Lexi to send once I have a Nationwide contact. ( Tiffany will submit)\n\n* Pt 1. Funding Docs:\n\n* Pt 2 Funding Docs:\n\n4. Plan \u0026 Payroll Set-Up\n\na. Sub Pack Review- TBD\n\nb. Pricing review: N/A- merger\n\nc. Payroll vendor: Paychex.\n\n* Will need data call with them to finalize specs.\n\nd. PRK Questionnaire- TBD- once we have a contact assigned.\n\n5. Communications\n\na. Required notices: TBD\n\nb. Conversion Newsletter: TBD\n\nc. Go-Live Email: TBD\n\nd. They want to use both logos for communications. We will figure out which logo they prefer and if needed two we can take it back to Samatha for review.\n\n6. Upcoming Project Plan Deliverables:\n\n* Jen to draft new TOA\n\n* Chris to draft merger toa\n\n* Client to confirm MVA plan\n\n* Lexi to find out about spark data feed to show nationwide assets at TRS (5-year put)\n\n7. Plan Notes:\n\n* Prior provider: Nationwide\n\n* Advisor to be paid from standing payments from EBA\n\n* PX- standard- YES\n\n* Stable Value fund – not liquid- MVA of 5-year put.\n\n* Need to confirm if there are any installments with Nationwide- PRK Call.\n\n* Advisor is Jamie Worrell\n\n* Current client does not outsource anything. This may change.\n\n* Separate payroll files and separate funding accounts- will need a new division code for Nursing Placement.\n\n* MVA for the Nationwide Stable Product- $40,131.74.\n\n* 5-year put would be benefit responsive\n\nPlease let me know if…","manual":false}]},{"d":"Oct 2","t":"Timeline challenged internally","n":"Tracy listed six blockers — unfinished merger compare, unsigned merger TOA, undecided payroll approach, 5500 split reporting concerns, missing subpack, no Nationwide assignment — and questioned whether 12/1 was achievable.","src":[{"from":"Martin, Tracy","d":"2025-10-02","time":"07:38","subj":"RE: Vesting for Nursing Placement","body":"Hi Dev\n\nI took Nationwide off this email.\n\nWe would need the following completed\n\n* Merger compare incomplete Email from Chris Caponigro- need finalized from client.\n\n* Merger TOA is not prepared and is not signed by the client\n\n* Client not sure how they are handling payroll. This is problematic as we try to set up payroll- need a final determination\n\n* Client is concerned with 5500 – split reporting. Seems like the client wants to move to avoid the split 5500.\n\n* Joel will need a signed and completed subpack before he can work the base file. This is still outstanding for client signature\n\n* We do not have an assignment at Nationwide currently, not sure how long it will take to get assignment.\n\nIn our experience with this plan has been slow to respond and indecisive on decision that need to be made. That is fair they want their plan to be what they want. Based on that we don’t think we can meet the timeline of 12/1.\n\nDoes the team feel based on the above that we can meet 12/1? Please add anything I need to adjust.\n\nTracy Martin\n\nSenior Manager, Client Onboarding\n\nTracy.Martin@transamerica.com \n\nTransamerica\n\n6400 C st. SW MS 2E-CR, Cedar Rapids, IA 52411\n\ntransamerica.com \n\nFacebook   /  X   /  YouTube   /  LinkedIn","manual":false}]},{"d":"Oct 2","t":"Blockers cleared in a day","n":"Dev confirmed via the Hilb Group TPA that there is no vesting on the plan (all employer money is Safe Harbor Match), and John Anderson at Nationwide confir roll runs pass clean","note":"The 7/2 go-live checklist gave this about two weeks. The clock has effectively restarted because the 7/8 run failed, so the hand-off now depends on 7/21 and the run after it.","who":"Team","src":[{"from":"Biondo, Jocelyn","d":"2026-07-02","time":"14:16","subj":"TA069932-00056 ISGRP - International School of Denver - Plan is live checklist","body":"Hello team,\n\nThis is my go live internal checklist/template.\n\nPlease see below the outstanding items needed for this plan.\n\nPlease update your parts in NBI\n\n@TC\n\n* Please remove hold on enrollment kits (I have not seen the Enrollment kits yet) – Dan?\n\n* Submit ticket to TRSC DDM Support to remove hold on SPD so new hires receive them – (Do we do this for MISBO plans?) Dan?\n\n* Run On Track for the plan but NOT send out the reports to participants. The objective is simply to establish Retirement Outlooks for reporting purposes. Takeover balances are NA (start up)\n\nPlease Reply All once the On Track data has been loaded.\n\nWe are outsourcing deferrals for this plan, so we have that in our system already. We do not have prior year comp. Start up.\n\n* Turn on OBF and review first run 7/6/2026\n\n@Document consultant\n\n* Please activate e-delivery see auto delivery form attached\n\n@COM\n\n* Jocelyn will be emailing the SDP to existing participants via Ellen (since we have it ready)\n\n* Jocelyn (or Mike) will provide Enrollment Guide to the client once we have a chance to review\n\n* Jocelyn will set up client survey request.\n\n* Jocelyn will hold hand off call with checklist for Marcos during next week’s internal Tuesday call.\n\n* Note: No CSR since no assets converted.\n\n@DC\n\nOnly remaining item is inbound payroll file testing. We can discuss when this will be handed off to PIC, let’s give it 2 weeks.\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com \n\nTransamerica\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false},{"from":"Biondo, Jocelyn","d":"2026-07-07","time":"09:55","subj":"ISGRP - International School of Denver Status call - last call recap","body":"Hi Seth and Drew,\n\nSorry we missed you on the call today. This was our last call, but I know you are on vacation this week, so I summarized the topics here and attached the recap for you.\n\nTODAY’S TOPICS\n\na. Last call – there will be no more status calls for Denver. We will set up payroll related calls as needed.\n\nb. Enrollment Guide – Please see the attached Enrollment Guide, which you should hand out to new hires.\n\nc. SPD- I have sent the SPD to your existing participants (email date will be tomorrow). You will provide this to participants going forward. Mike will ensure this is also posted to our website.\n\nd. Many items have been activated on your plan this week: automated termination and eligibility letters, confirms, and loan default letters.\n\ne. You will be receiving a client Survey to be sent. Please provide your feedback on your experience with the transition.\n\nf. UKG update – we will test the 7/8/26 check date live file before sending ot to production for funding. We will have a website walk through call to walk through how to do the funding once that production upload takes place.\n\ng. OBF – the outbound file is ready for automation starting 7/13. Seth already accessed the 7/6 updates manually.\n\nWe will be conducting the one-on-one counseling sessions this month. We will also be completing the payroll inbound testing and set up for automated FTP processing. Other than that, the transition is complete. The On Track feature for retirement planning can be turned on once we have a year’s worth of history on this start up plan for the basis of modeling. Marcos can help you with that.\n\nIt has been a pleasure working with you both. Thank you for your partnership in completing this transition successfully and on time!\n\nPlease be sure to reach out to Marcos and Mike for any of your daily needs.\n\nTake Care,\n\nJocelyn\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com \n\nTransamerica\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]}],"history":[{"d":"Apr 16","t":"Subpack finalized","n":"Circulated on the weekly internal call after several rounds.","src":[{"from":"Biondo, Jocelyn","d":"2026-04-15","time":"08:09","subj":"ISGRP - Denver International Internal weekly TA069932-00056 SUBPACK","body":"Hello,\n\nThank you for your time reviewing the subpack today. I have updated it and saved to the subpack folder.\n\nPlease review for the items you expect to be filled out and let me know if you have any questions. @Rosselli, Thomas @Clifford, Dan @Costanza, Samantha \n\nThe outstanding section is the Payroll section since we have not received any information yet on that. Once I have that filled out I will consider this final.\n\nThank you\n\nJocelyn\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com \n\nTransamerica\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false},{"from":"Biondo, Jocelyn","d":"2026-04-16","time":"05:47","subj":"RE: ISGRP - Denver International Internal weekly TA069932-00056 SUBPACK","body":"Hi Dan,\n\nI meant to invite you but I added your name to the series after the meeting yesterday. My fault. That said, thank you for reviewing the subpack for us!\n\n1. I thought I left the info-sharing blank – I will check and correct.\n\n2. Loans are payroll deducted (as they do today). Coupons may be used for terminated people to continue paying loans (per Sarah, I only check the coupon box on the Subpack if the coupons are permitted for active people, which they are not in this case).\n\nJocelyn\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com","manual":false}]},{"d":"May 12","t":"Base file template and specs sent to client","n":"Paired with the contribution-limit and 2-year eligibility questions being settled the same week.","src":[{"from":"Biondo, Jocelyn","d":"2026-05-04","time":"07:59","subj":"RE: International sch of Denver (MISBO 00056) - need base file template and file specs","body":"Thanks, Joel!\n\nI have 2 more requests:\n\n1. For the Denver client call tomorrow - It is time to request the base file criteria, because they take several weeks of reminders to get anything done. Are you able to provide Seth with the Base file template? This will be related to the answer below, I think. We will not load those YTD data elements – but you might request them on this file for use elsewhere.\n\n2. Denver also does not have the payroll team assigned – so you will be creating the file specs for UKG. They have been notified. They have generic specs. The Start-up Grid (PRD) is complete and attached. Also in the folder. If you can start those custom file specs, that would be awesome!","manual":false},{"from":"Biondo, Jocelyn","d":"2026-05-07","time":"14:48","subj":"TA069932-00056 ISGRP - Denver International base file request","body":"Hi Seth and Drew,\n\nAttached is the template for the base file we are requesting from you. We walked through this on our last call. We will require a final version of this around June 19-25, but we would like to review a test file this month so we can ensure we will have what we need to seed the system on June 25 and open the website on July 1. We will only need the actives.\n\nIf you provide a good file with real data by 5/25 we can use that for our mailing list for the Notices. Otherwise, we will need an address file, as we talked about during the meeting, with the criteria listed in the agenda.\n\nPlease reach out to Joel or me if you have any questions.","manual":false}]},{"d":"May 26","t":"System setup notices issued","n":"UKG payroll contact established — Lucy becomes the working contact from here on.","src":[{"from":"Biondo, Jocelyn","d":"2026-05-26","time":"08:55","subj":"RE: TA069932 00056 International School of Denver, Inc. - System setup Notices","body":"Hi Dan,\n\nOdd though, I do not see any difference in the fee disclosure nor the initial QDIA notice previously provided. Please elaborate on what the difference was.\n\nThank you\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com","manual":false},{"from":"Biondo, Jocelyn","d":"2026-05-26","time":"10:04","subj":"UKG - Lucy - IS of Denver payroll contact -","body":"Jocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nWe have a name...hopefully, we have contact soon...\n\nSeth Winnerman\n\nSenior Director of Operations\n\nISDenver staff, book a meeting with me: M/T at the High School, W/Th/F at Main Campus, Virtual - any day\n\ne: seth.winnerman@isdenver.org \n\nw: isdenver.org \n\n7701 E. 1st Pl Unit C, Denver, CO 80230\n\nMultilingual education. Global mindset. Extraordinary impact.\n\n---------- Forwarded message ---------","manual":false}]},{"d":"Jun 17","t":"FTP setup worked through","n":"A 13-email thread; the sticking point was an extra hyphen in the filename causing the transfer to error.","src":[{"from":"Clifford, Dan","d":"2026-06-17","time":"13:26","subj":"RE: ISD – TA069932-00056 - FTP Setup","body":"Hi, OBF page is set up.\n\nThis plan is Semi-Monthly, however, we know that OBF frequency is not to be used. Instead, I set it to the next best thing, Weekly as the solution.\n\nSummary\n\n* Weekly\n\n* Mondays\n\n* Holiday roll: Previous\n\n* First obf is 7/6, so the system date is 7/2 (thu), as Jul 3 is a federal holiday. Or should I make the sys date 7/3, because I have it as “previous”?\n\n* Alert emails to Seth \u0026 Drew\n\nFrom: Clifford, Dan","manual":false},{"from":"Biondo, Jocelyn","d":"2026-06-17","time":"13:38","subj":"RE: ISD – TA069932-00056 - FTP Setup","body":"Will this still pull changes made on Sunday 7/5? I was tol nt. Please provide your feedback on your experience with the transition.\n\nf. UKG update – we will test the 7/8/26 check date live file before sending ot to production for funding. We will have a website walk through call to walk through how to do the funding once that production upload takes place.\n\ng. OBF – the outbound file is ready for automation starting 7/13. Seth already accessed the 7/6 updates manually.\n\nWe will be conducting the one-on-one counseling sessions this month. We will also be completing the payroll inbound testing and set up for automated FTP processing. Other than that, the transition is complete. The On Track feature for retirement planning can be turned on once we have a year’s worth of history on this start up plan for the basis of modeling. Marcos can help you with that.\n\nIt has been a pleasure working with you both. Thank you for your partnership in completing this transition successfully and on time!\n\nPlease be sure to reach out to Marcos and Mike for any of your daily needs.\n\nTake Care,\n\nJocelyn\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com \n\nTransamerica\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]},{"d":"Jul 8","t":"First live payroll file tested","n":"Run against the 7/8 check date with the intention of moving to production for funding.","src":[{"from":"Biondo, Jocelyn","d":"2026-07-08","time":"05:48","subj":"FW: TA069932-00056 IS Denver - troubleshoot file in FTP","body":"Maybe I am blocked from contacting him. Can you teams message mark to see if he will show up to our meeting?\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com","manual":false},{"from":"Biondo, Jocelyn","d":"2026-07-08","time":"12:31","subj":"Re: Payroll Totals","body":"Normally you (DC) provide the totals from the test file to the client to have him approve them.\n\nI\u0027m not sure if Lucy v e the 7/21/26 check date.\n\nThank you\n\nJocelyn\n\nJocelyn Biondo\n\nSr Client Onboarding Manager, Client Transition Services\n\nJocelyn.Biondo@transamerica.com \n\nTransamerica\n\ntransamerica.com \n\nFacebook / X / YouTube / LinkedIn","manual":false}]},{"t":"No On Track profiles for a start-up plan","n":"Nothing to model against without history. Marcos can turn it on after a year of data accumulates.","src":[{"from":"Biondo, Jocelyn","d":"2026-07-02","time":"14:16","subj":"TA069932-00056 ISGRP - International School of Denver - Plan is live checklist","body":"Hello team,\n\nThis is my go live internal checklist/template.\n\nPlease see below the outstanding items needed for this plan.\n\nPlease update your parts in NBI\n\n@TC\n\n* Please remove hold on enrollment kits (I have not seen the Enrollment kits yet) – Dan?\n\n* Submit ticket to TRSC DDM Support to remove hold on SPD so new hires receive them – (Do we do this for MISBO plans?) Dan?\n\n* Run On Track for the plan but NOT send out the reports to participants. The objective is simply to establish Retirement Outlooks for reporting purposes. Takeover balances are NA (start up)\n\nPlease Reply All once the On Track data has been loaded.\n\nWe are outsourcing deferrals for this plan, so we have that in our system already. We do not have prior year comp. Start up.\n\n* Turn on OBF and review first run 7/6/2026\n\n@Document consultant\n\n* Please activate e-delivery see auto delivery form attached\n\n@COM\n\n* Jocelyn will be emailing the SDP to existing participants via Ellen (since we have it ready)\n\n* Jocelyn (or Mike) will provide Enrollment Guide to the client once we have a chance to review\n\n* Jocelyn will set up client survey request.\n\n* Jocelyn will hold hand off call with checklist for Marcos during next week’s internal Tuesday call.\n\n* Note: No CSR since no assets converted.\n\n@DC\n\nOnly remaining item is inbound payroll file testing. We can discuss when this will be handed off to PIC, let’s g  only just took over the 180 integration setup and hasn\u0027t confirmed a file format or FTP contact yet.","open":[{"task":"Create the interim payroll file for One Payroll","note":"Covers the 7/24 and 8/7 runs, which have to be uploaded by hand while iSolved\u0027s 180 integration is still getting set up. Blackout starts tomorrow with nothing else in place yet.","who":"Joel","mine":true,"src":[{"from":"Hurm, Damien","d":"2026-07-22","time":"09:15","subj":"RE: Leiby\u0027s Dairy - QK63283 00112 - Weekly Internal Call 7.22 (recap)","body":"Good Afternoon Everyone,\n\nA few of us were able to meet earlier today to review the install progress for the Leiby’s Dairy 401k plan currently with Ascensus.\n\nPlease see below \u0026 let me know if you have any questions, the recap from our call earlier today is attached.\n\n** limited access started 7/13 \u0026 will run through 7/29.\n\n(dhurm) the announcement was sent to the group beginning of last week.\n\n** base data is pending completion.\n\n(dhurm) Joel provided feedback after reviewing the test files, which was sent to the client to review, please see attached.\n\n(dhurm) Amanda confirmed that she can get prior year \u0026 year to date info over to us shortly.\n\n** the Adoption Agreement was completed via DocuSign earlier today by all parties.\n\n(dhurm) this was sent to the Signed Docs team, please see attached.\n\n** payroll layouts created, which Joel was able to review on the 6/3 client call.\n\n(dhurm) the client confirmed someone else has been assigned, Joel \u0026 I will be included on any follow up items related to payroll.\n\n(dhurm) PayKonnect (global connection)\n\n** interim payroll likely required for the 7/24 \u0026 8/7 payroll files, manually uploaded once loans are loaded to the system.\n\n(dhurm) Joel will get the interim payroll file created, added for One Payroll.\n\n** there’s an issue with the Plan Sponsor Site where new users can’t be created under the EW PEP.\n\n(dhurm) we were informed that this should be resolved soon, where the three client contacts should be added to the plan when we’re ready to proceed.\n\nInstallation Summary – 8/1/2026\n\n* Transition Overview (dhurm) cash-conversion (100% re-enrollment) into Financial Guide (CPMA)\n* Conversion Timeline\n\na. ✓ 6/24/2026 – Deadline to Distribute Notices.\nb. ✓ 7/13/2026 – Limited Access Start Date with Transamerica (will run through 7/29)\nc. 7/24/2026 – Blackout Start Date with Ascensus\nd. 7/31/2026 – Liquidation Date with Ascensus\ne. 8/3/2026 – Wire Date with Ascensus\nf. 8/14/2026 – Final Takeover Records with Ascensus (dhurm) the client will have to pull these reports off the Ascensus site.\ng. 8/28/2026 – Go Live Deadline with Transamerica.\n\nFirst Payroll to Transamerica (dhurm) the 7/10 payroll was the last payroll processed with Ascensus before blackout begins 7/24 \u0026 the 7/24 payroll will be the first payroll funded with Transamerica shortly after go live.\n\n(dhurm) the client will likely need to manually upload the 7/10 \u0026 8/7 payroll files manually while we wait for iSolved to complete the FTP connection feed.\n\nPlan Documents and Agreements\n\n* Transfer of Assets Agreement (dhurm) completed.\n* Plan Review Document (dhurm…","manual":false}]},{"task":"Get Melanie Rhine\u0027s answers on the 180 payroll integration","note":"You sent her the file layouts on 7/21 and asked whether she owns FTP automation setup or has a contact, plus what file format they\u0027ll use. Neither has come back yet, and the interim manual-upload process stays in place until it does.","who":"Melanie Rhine","src":[{"from":"Rhine, Melanie","d":"2026-07-21","time":"14:08","subj":"401(K) 180 Introduction Email / Leiby\u0027s Dairy Inc.","body":"Hello,\n\nI wanted to reach out and introduce myself. I will be working with you to help set up your 401k 180° Data Integration connection between isolved and Transamerica for Plan ID QB63283 00112.\n\nJoel -  I will be the payroll integration contact for the 180 integration, perform the configuration setup, facilitate testing, and coordinate the move to production using this new delivery method after your providers approval.  Can you please send me the specs to be used for this file?\n\nIt looks like the setup of your existing plan in isolved is a 401k Pre-tax, Roth, Discretionary Employer Match, and your plan does allow 2 loan(s). Are these the correct plan types?\n\nFinally, please confirm how you are currently processing 401k contributions.  Your existing file delivery method to the provider would need to be continued throughout testing but turned off before the first live file with this new delivery method.  When testing is completed and the provider integration payroll assignee has signed off, we will plan a Go Live date together.  As a standard, 180° testing usually takes about 3-4 payrolls or less with the provider. The provider determines and will let isolved know when we can move the contribution piece of the 180° Data Integration live.\n\nBecause the client is responsible for reporting contributions until we are live, if reporting is required while testing, ongoing retirement contributions by payroll run can be obtained by the client from isolved Reporting. Please follow the prompts below.\n\nReporting\u003eMy Reports\u003e filter by Retirement Report by payroll run (select run options in the dropdown) Select Generate Report tab and then retrieve your report from the Go to my Reports Queue tab.\n\nI am looking forward to working with you and your 401k provider. Please let me know if you have any questions.\n\nThank you,\n\nMELANIE RHINE\n\nINTEGRATION ANALYST\n\nD: 704.233.3427\n\nisolvedhcm.com LinkedIn Twitter Media Center \n\nThis message may contain confidential and/or privileged information. If you are not the addressee or authorized to receive this for the addressee, you may not use, copy, disclose, or take any action based on this message or any information or attachments herein. If you have received this m const NBI_SRC = {};

// Resolve the master list against one plan's DC status table. Only tasks the
// table actually speaks to survive -- a bare master task with no date and no
// note says nothing, so it is not a row.
function nbiFor(p){
  const byItem = {};
  for (const l of (p.loads||[])) byItem[l.what] = l;
  return NBI.map(([ws, subs]) => ({
    ws,
    subs: subs.map(([sname, tasks]) => ({
      name: sname,
      tasks: tasks.map(name => {
        const hits = (NBI_SRC[name]||[]).map(i => byItem[i]).filter(Boolean);
        const dated = hits.find(h => h.date && h.date !== "N/A");
        const na = !dated && hits.length && hits.every(h => h.date === "N/A");
        const note = hits.map(h => h.note).filter(Boolean).join(" ");
        const chg = hits.map(h => h.chg).filter(Boolean);
        const bul = hits.flatMap(h => h.bul || []);
        return { key: ws+"|"+sname+"|"+name, name,
                 date: dated ? dated.date : "", na, note, bul,
                 chg: chg.includes("added") ? "added" : (chg[0] || ""),
                 from: hits.map(h => h.what) };
      }).filter(t => t.date || t.na || t.note)
    })).filter(s => s.tasks.length)
  })).filter(w => w.subs.length);
}
const NBI_TOTAL = NBI.reduce((a,[,subs]) => a + subs.reduce((b,[,t]) => b + t.length, 0), 0);

/* A status cell is one long run of text, but the writer usually kept a running
   log inside it -- dated entries, semicolons, asterisk bullets. Break it back
   apart so it reads as lines and pastes as lines. */
function noteParts(s){
  const tries = [/\s*;\s+/, /\s+\*\s+/, /(?=\b\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?\s*[-:]\s)/];
  // only break on sentences once the cell is long enough that a wall of text
  // is the actual problem
  if (s.length > 150) tries.push(/(?<=[.!?])\s+(?=[A-Z0-9$"'\\])/);
  for (const rx of tries) {
    const parts = s.split(rx).map(x => x.trim()).filter(Boolean);
    if (parts.length > 1) return parts;
  }
  return null;
}
function noteHtml(s){
  const parts = noteParts(s);
  return parts ? `<ul class="tlist">${parts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : esc(s);
}
// plain text for the clipboard -- what you would paste into a status email.
// the authored read is what goes out; the raw cell stays on screen only.
function subText(name, tasks){
  return name + "\n" + tasks.map(t => {
    const d = t.date || (t.na ? "N/A" : "no date");
    const lines = t.bul.length ? t.bul : (t.note ? (noteParts(t.note) || [t.note]) : []);
    const n = lines.length ? "\n  " + lines.join("\n  ") : "";
    return `- ${t.name} — ${d}${n}`;
  }).join("\n");
}
const nbiDone = t => !!t.date || t.na;
const chgWord = { added:"NEW", updated:"UPDATED" };
const nbiMoved = p => { let n = 0;
  for (const w of nbiFor(p)) for (const s of w.subs) for (const t of s.tasks) if (t.chg) n++;
  return n; };

      <div class="facts">

  current = view === "case" ? null : id;
  SRCS = [];
  main.innerHTML = view === "nbi" ? nbiPage(id) : view === "detail" ? detail(id) : caseload();
  drawRail();
  navEl.innerHTML = navbar();
  subEl.innerHTML = substrip();
  const mt = mineTotal(); document.getElementById("mechip").textContent = mt ? mt + (mt > 1 ? " ITEMS ON YOU" : " ITEM ON YOU") : "NOTHING ON YOU";
  navEl.querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.f; render("case"); });
  main.scrollTop = 0;
  pinHero();
}
// CSS cannot tell that a sticky element has hit its offset, and the pinned name
// plate has to be shorter than the hero line it came from
function pinHero(){
  const f = main.querySelector(".frame"), h = f && f.querySelector(".hrow");
  if (h) f.classList.toggle("stuck", h.getBoundingClientRect().top <= main.getBoundingClientRect().top + .5);
}
main.addEventListener("scroll", pinHero);
function drawRail(){
  const at = railEl.scrollTop;
  railEl.innerHTML = rail();
  railEl.scrollTop = at;
  railEl.querySelectorAll(".rlink").forEach(b => b.onclick = () => render("detail", b.dataset.id));
  railEl.querySelectorAll(".rh").forEach(b => b.onclick = () => {
    const g = b.dataset.g;
    collapsed.has(g) ? collapsed.delete(g) : collapsed.add(g);
    drawRail();
  });
}
main.addEventListener("click", e => {
  const c = e.target.closest(".src");
  if (c) { e.stopPropagation(); openMail(SRCS[+c.dataset.i]); return; }
  const nb = e.target.closest("[data-nbi]");
  if (nb) { e.stopPropagation(); render("nbi", nb.dataset.nbi); return; }
  const cp = e.target.closest(".tcopy");
  if (cp) { e.stopPropagation(); navigator.clipboard.writeText(cp.dataset.copy);
            cp.textContent = "copied"; setTimeout(() => { cp.textContent = "copy"; }, 1200); return; }
  const b = e.target.closest("#back");
  if (b) { b.dataset.plan ? render("detail", b.dataset.plan) : render("case"); return; }
  const t = e.target.closest("[data-id]");
  if (t) render("detail", t.dataset.id);
});
document.getElementById("mx").onclick = () => document.getElementById("ov").classList.remove("on");
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("ov").classList.remove("on"); });
document.getElementById("ov").addEventListener("click", e => { if (e.target.id === "ov") e.currentTarget.classList.remove("on"); });
document.getElementById("rsearch").oninput = e => { query = e.target.value; drawRail(); };
render("case");
</script>
</body>
</html>
